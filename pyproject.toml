[project]
name = "ai-audio-transcription-examples"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "transformers>=5.3.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "librosa>=0.11.0",
    "openai-whisper>=20250625",
    "pyannote-audio>=4.0.4",
    "python-dotenv>=1.2.2",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
